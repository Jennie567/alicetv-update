name: Build AliceTV Channels

on:
  push:
    paths:
      - 'channels/**'
      - 'build.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build JSON and M3U
        run: |
          python build.py

      - name: Show changes
        run: |
          git status
          git diff --stat

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A templates m3u version.json

          git status

          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Auto update channels"
            git push
          fi
