name: Build AliceTV Channels

on:
  push:
    paths:
      - 'channels/**'

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build JSON
        run: python build.py

      - name: Commit files

        run: |

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add templates/*.json version.json

          git commit -m "Auto update channels" || echo "No changes"

          git push
