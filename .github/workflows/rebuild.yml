name: Rebuild AliceTV Channels

on:
  push:
    branches:
      - main
    paths:
      - 'channels/**'
      - 'build.py'
      - '_worker.js'
      - '.github/workflows/rebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build.py
        run: |
          python build.py

      - name: Show git changes
        run: |
          git status
          git diff --stat

      - name: Commit generated files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A templates m3u version.json

          git status

          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Auto update channels"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
